services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: record_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d record_store"]
      interval: 5s
      retries: 10

volumes:
  pgdata: