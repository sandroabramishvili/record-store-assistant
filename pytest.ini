[pytest]
# Tests import `app...` from the project root.
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# LangSmith's pytest plugin uses an API deprecated in Python 3.14 (library issue, not ours).
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith
